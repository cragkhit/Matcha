##### GENERAL CONFIGURATIONS
# location of elasticsearch
elasticsearchLoc=/Users/chaiyong/Downloads/matcha/elasticsearch-2.2.0

# elasticsearch's server name (or IP)
server=localhost

# elasticsearch's cluster name. See cluster.name in your $elasticsearchLoc/config/elasticsearch.yml
cluster=stackoverflow

# index name
index=javascript_files
# For example: index=javascript_test

# type name
type=siamese

# location of the input folder. This is the location of the files to be indexed (if command=index),
# or the location of the queries (if command=search).
inputFolder=/Users/chaiyong/Downloads/matcha/javascript_files_splits/split_02
# For example: inputFolder=/my/location/of/javascript/projects

# only for GitHub indexing, leave blank if not needed
subInputFolder=

# pattern file used to skip boilerplate methods during search (JavaScript-specific patterns)
boilerplateCodePatternFile=/Users/chaiyong/Downloads/matcha/1_matcha/references/BoilerPlateConfig_javascript.txt

# output folder to store the search results
outputFolder=search_results

# optional: absolute path of every file the indexer finishes processing (success or parse
# failure) is appended here, one per line. Opened in append mode, so the same path can be
# reused across a killed/restarted run to build a complete manifest for a clean resume
# (remaining files = everything under inputFolder NOT in this file). Leave blank to disable.
processedFilesLog=/Users/chaiyong/Downloads/matcha/1_matcha/processed_javascript_files_split_02.txt
# For example: outputFolder=search_results

# use DFS mode [default=no]
dfs=true
writeToFile=true

# source code file extension
extension=js

# minimum clone size (lines)
minCloneSize=6

# command to execute [index,search]
command=index

# print out logging data
isPrint=false

# output format [csv = filename, csvfline = filename#start#end), gcf = general clone format]
outputFormat=csvfline

# indexing mode [sequential, bulk]
indexingMode=bulk

# size of bulk insert
bulkSize=4000

# clone granularity [method, file]
parseMode=method

# print the progress of indexing/querying in every x files
printEvery=10000

# recreate the index if it exists [true, false]
recreateIndexIfExists=false

##### DELETE SETTINGS
deleteField=
deleteWildcard=
deleteAmount=1000

##### PARSER + TOKENIZER + NORMALIZER SETTINGS
methodParser=crest.siamese.language.javascript.JSMethodParser
tokenizer=crest.siamese.language.javascript.JSTokenizer
normalizer=crest.siamese.language.javascript.JSNormalizer

##### MULTI-REPRESENTATION SETTINGS
multirep=true
enableRep=true,true,true,true

##### NORMALIZATION MODE
##### Code normalisation for T2 and T3 representation.
### JavaScript
# Combination of k (keywords), v (values), s (strings), o (operators), w (words)
# T2 norm mode: vsw
# T3 norm mode: kvsow
normalizerMode=crest.siamese.language.javascript.JSNormalizerMode
t2NormMode=vsw
t3NormMode=kvsow

# turn on ngram
isNgram=true
# size of ngram.
# representation T3
ngramSize=4
# representation T2
t2NgramSize=4
# representation T1
t1NgramSize=4

##### QUERY-RELATED SETTINGS
# starting result offset (usually zero)
resultOffset=0
# the size of the results
resultsSize=100
# tfidf, bm25, dfr, ib, lmd (LM Dirichlet), lmj (LM Jelinek-Mercer)
rankingFunction=tfidf
# QUERY REDUCTION SETTINGS
# turn on query reduction [true/false]
queryReduction=true
# reduction percentile for the T3 layer (r3) [0, 100]
QRPercentileNorm=9
# reduction percentile for the T2 layer (r2) [0, 100]
QRPercentileT2=5
# reduction percentile for the T1 layer (r1) [0, 100]
QRPercentileT1=6
# reduction percentile for the T0/orig layer (r0) [0, 100]
QRPercentileOrig=9
# boosting for T3 layer
normBoost=4
# boosting for T2 layer
t2Boost=4
# boosting for T1 layer
t1Boost=4
# boosting for T0 layer
origBoost=1
# ignore the query clones
ignoreQueryClones=true

##### LICENSE EXTRACTION
# extract license [true, false]
license=false
# license extractor [ninka, regexp]
licenseExtractor=regexp

##### EXPERIMENT CONFIGURATIONS
# ONLY USED FOR THE EXPERIMENTS OF SIAMESE
# elasticsearch similarity function + ngram + normalisation [or both]
similarityMode=tfidf_text_both
# prefix of the clone cluster file name [cloplag/soco]
cloneClusterFile=soco
# IR error measure [arp/map]
errorMeasure=map
# delete the index after every run?
deleteIndexAfterUse=true

##### SIMILARITY
# compute similarity of the results [fuzzywuzzy, tokenratio, none]
computeSimilarity=tokenratio
# the similarity threshold for the four representations [T1,T2,T3,T4] respectively
simThreshold=50%,60%,70%,80%
# GitHub indexing? (automatically add URL)
github=false

##### DEPRECATED
# (DEPRECATED) no. of total documents in the index
totalDocuments=100
